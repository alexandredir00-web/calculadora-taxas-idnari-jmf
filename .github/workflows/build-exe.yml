name: Gerar EXE Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar projeto Electron e gerar instalador EXE
        run: |
          npm pkg set name="calculadora-taxas-idnari-jmf"
          npm pkg set version="1.0.0"
          npm pkg set description="Calculadora de Taxas - IDNARI & JMF"
          npm pkg set main="main.js"
          npm pkg set scripts.build="electron-builder --win nsis --x64"
          npm pkg set build.appId="com.idnarijmf.taxas.desktop"
          npm pkg set build.productName="Calculadora Taxas IDNARI JMF"
          npm pkg set build.win.target="nsis"
          npm install --save-dev electron electron-builder
          npm run build

      - name: Enviar instalador EXE para download
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-EXE-Taxas-IDNARI-JMF
          path: dist/*.exe
